[main]
async_thread_count = 2

# asio context 线程数量
asio_pool_size=2
# 程序主循环每个tick的时间间隔
main_loop_interval_ms=50
# 每拍每个 task 最多处理多少条入站消息。
# 0 = 不限（抽干，见 ADR-0004）。突发流量下抽干会让单拍耗时没有上界，一拍跑爆后
# 主循环落后，而时间轮不做补拍（ADR-0001），会整体走慢且再也追不回来。
# 配成正数即给单拍耗时设上界，超出的留到下一拍。
# 代价不只是延迟上升：接收队列有入队侧上限（见下面的 receive_queue_capacity），
# 限量降低了消费速率，持续跟不上时队列填满，此后 io 线程直接丢弃新消息。这是拿
# "突发时丢消息"换"定时器不落后"。单连接消费能力约为
# 本值 × (1000 / main_loop_interval_ms) 条/秒。
max_messages_per_task_per_tick=0
# 每拍所有 task 合计最多处理多少条入站消息。0 = 不限。
# 每 task 的上限挡不住连接数这个维度：1 万连接 × 每连接 64 条 = 64 万条/拍照样跑爆。
# 这是整拍的硬上界，与轮转配套保证连接之间公平。
max_messages_per_tick=0
# 每条连接的接收队列上限（条数）。到底层无界队列之上的入队侧闸门：
# 满了 io 线程丢弃新帧并计数告警。它同时锁住内存高水位（底层 block 只回收
# 不归还系统）。只在启动时读取，运行中改不了。
receive_queue_capacity=256
# 每条连接的发送队列上限（条数）。比接收侧大：广播等场景会瞬时冲高，
# 等一拍就发完了，取小了会误弃载。同时修掉"对端不读导致发送队列无限增长"。
send_queue_capacity=1024
# 配置文件目录
config_dir = ../gameconfigs/
# 日志配置文件路径
log_yml_path = ../gameconfigs/log.yml

# 数据库配置
[mysql]
host = mysql-8-0
port = 3306
user = user
password = 123456
database = TinyDB

[redis]
host = redis-7-2
port = 6379
dbindex = 0
password = 123456

# 网络配置
[network]
# 服务器端口
port = 8080
# 服务器主机
host = 127.0.0.1
# 模式：server 或 client
mode = server

# 日志配置
[logger]
# 日志目录
log_dir = logs
# 应用名称
app_name = network_example
# 日志文件名
log_file = app.log
# 滚动策略：HOURLY 或 DAILY
rotation_policy = DAILY
# 保留天数（按日滚动时使用）
retention_days = 30
# 保留小时数（按小时滚动时使用）
retention_hours = 72
# 单个文件最大大小（默认100MB）
max_file_size = 104857600
# 是否启用控制台日志
enable_console = true
# 是否启用异步模式
async_mode = false
# 异步队列大小
async_queue_size = 8192
# 控制台日志级别：TRACE, LOG_DEBUG, LOG_INFO, WARN, ERROR, CRITICAL, OFF
console_level = TRACE
# 文件日志级别：TRACE, LOG_DEBUG, LOG_INFO, WARN, ERROR, CRITICAL, OFF
file_level = TRACE
# 日志格式
pattern = [%Y-%m-%d %H:%M:%S.%e] [%^%t%$] [%^%l%$] %v


# 加密配置
[encryption]
# 加密密钥（AES-128，长度为16字节）
key = MySecretKey1234567890123456
# 加密向量（AES-128，长度为16字节）
iv = MySecretIV1234567890123456

[gateway]
listen_port = 8080
listen_host = 0.0.0.0
backend_host = 127.0.0.1
backend_port = 9090
thread_count = 4
max_connections = 10000

[tinyserver]
listen_port = 9090
listen_host = 0.0.0.0
thread_count = 4
max_connections = 10000
heartbeat_interval_ms = 30000
idle_timeout_ms = 60000

[client]
server_host = 127.0.0.1
server_port = 8080
client_count = 4
reconnect_interval_ms = 5000
heartbeat_interval_ms = 30000

[dataserver]
listen_port = 9100
listen_host = 0.0.0.0
thread_count = 2
db_path = ./data
max_cache_size = 104857600
