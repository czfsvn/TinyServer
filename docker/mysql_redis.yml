version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: test_db
      TZ: Asia/Shanghai
    volumes:
      - /home/czf/docker-datas/mysql-8-0:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - /home/czf/docker-datas/redis-7-2:/data
    command: redis-server --requirepass 123456 --appendonly yes

volumes:
  mysql_data:
  redis_data: